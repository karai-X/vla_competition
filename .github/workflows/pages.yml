# portfolio/ の静的ページを GitHub Pages へ公開する。
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["portfolio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: portfolio
      - name: Collect static files
        run: |
          mkdir -p _site
          cp portfolio/index.html portfolio/app.css portfolio/app.js _site/
          cp -r portfolio/materials _site/materials
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
